<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Youssef Kachmar</title><desc id="desc">Cyberpunk inspired hot pink shards, white glitch lettering, scanlines and small yellow accents.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#230c1a"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h4" stroke="#000" stroke-opacity=".24"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ff2d78" stroke-opacity=".07"/></pattern>
<clipPath id="slice"><path d="M170 142h850v10H170zM170 182h850v6H170z"/></clipPath>
</defs>
<style>
.name{font:900 italic 118px 'Arial Black','Arial',sans-serif;letter-spacing:-6px;text-anchor:middle}
.small{font:12px Consolas,monospace;letter-spacing:3px}
.ghost{animation:glitch 5s infinite;opacity:.65}
.slice{animation:cut 5s infinite;opacity:0}
@keyframes glitch{0%,89%,100%{transform:translateX(0)}90%{transform:translateX(-8px)}92%{transform:translateX(5px)}94%{transform:translateX(-3px)}}
@keyframes cut{0%,89%,96%,100%{opacity:0;transform:translateX(0)}90%,93%{opacity:1;transform:translateX(12px)}92%,95%{opacity:1;transform:translateX(-10px)}}
@media(prefers-reduced-motion:reduce){.ghost,.slice{animation:none}}
</style>
