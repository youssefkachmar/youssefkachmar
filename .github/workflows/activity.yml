name: Refresh profile activity
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/activity.py
      - .github/workflows/activity.yml
permissions:
  contents: write
concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate calendar
        run: python3 scripts/activity.py
      - name: Save calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution calendar"
            git push
          fi
